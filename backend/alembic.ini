# Alembic (database migrations) config.
# Run from the repo root:  alembic -c backend/alembic.ini upgrade head
# Inside the backend container (working dir /app):  alembic upgrade head
#
# The database URL is not set here: alembic/env.py reads it from our Settings (env vars / .env).

[alembic]
# %(here)s = the folder this file is in, so paths work no matter where alembic is run from
script_location = %(here)s/alembic
# put backend/ on the import path so env.py can `import app`
prepend_sys_path = %(here)s
path_separator = os
# migration file names: <revision id>_<message>.py, e.g. 0001_enable_postgis.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
