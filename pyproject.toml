[tool.ruff]
target-version = "py312"
line-length = 100
# where our own packages live, so `app` imports sort as first-party
src = [".", "backend"]

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (real bugs like unused imports, undefined names)
# I: import sorting
# B: bugbear (common Python pitfalls)
# UP: pyupgrade (modern syntax for the target Python version)
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) would otherwise make ruff think the alembic library is ours
known-third-party = ["alembic"]

[tool.pytest.ini_options]
# run pytest from the repo root. backend/ is on the path so tests can `import app`;
# the repo root is on it so they can `import pipeline`.
testpaths = ["backend/tests", "pipeline/tests"]
pythonpath = ["backend", "."]
