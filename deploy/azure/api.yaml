# The API container app. deploy.sh fills in the ${...} values and creates or updates the app.
# Two containers share each replica: the FastAPI app and a Redis "sidecar" it reaches at
# localhost. Redis only holds disposable data (map cache, geocode cache, rate-limit counts), so
# it doesn't need its own always-on service: it starts and stops with the API, which scales to
# zero when nobody is using the site.
location: ${LOCATION}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ${IDENTITY_ID}: {}
properties:
  managedEnvironmentId: ${ENVIRONMENT_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      allowInsecure: false # HTTPS only
    secrets:
      # Read from Key Vault through the managed identity; never stored in this file
      # The API's own limited role, not the admin (see backend/app/db/api_role.py)
      - name: postgres-api-password
        keyVaultUrl: ${KEY_VAULT_URI}/postgres-api-password
        identity: ${IDENTITY_ID}
  template:
    containers:
      - name: api
        image: ${BACKEND_IMAGE_REF}
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: POSTGRES_HOST
            value: ${DB_HOST}
          - name: POSTGRES_DB
            value: ${DB_NAME}
          - name: POSTGRES_USER
            value: ${API_DB_USER}
          - name: POSTGRES_PASSWORD
            secretRef: postgres-api-password
          - name: POSTGRES_SSLMODE
            value: require
          - name: REDIS_HOST
            value: localhost
          - name: ALLOWED_ORIGINS
            value: ${FRONTEND_URL}
          # Azure's ingress is the one proxy in front of the API: it appends the client's IP to
          # X-Forwarded-For. The rate limiter trusts only that last entry, since a client can
          # put anything before it (see backend/app/rate_limit.py).
          # No interactive API docs on the live site (they're still on locally)
          - name: API_DOCS_ENABLED
            value: "false"
          - name: TRUSTED_PROXY_HOPS
            value: "1"
        probes:
          - type: Readiness
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
      - name: redis
        # Pinned to an exact image (digest), so a changed "redis:7" can't slip into production.
        # To update: docker buildx imagetools inspect redis:7 (the first Digest line)
        image: docker.io/library/redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        resources:
          cpu: 0.25
          memory: 0.5Gi
        # A cache: don't save to disk. Cap memory below the container's 0.5 GiB, and when full,
        # evict the least recently used keys (allkeys-lru) instead of failing writes, so a flood
        # of new address searches can't crash Redis. Losing a cached key only costs a slower
        # request; losing a rate-limit count briefly allows a few extra requests.
        args:
          ["--save", "", "--appendonly", "no", "--maxmemory", "400mb", "--maxmemory-policy", "allkeys-lru"]
    scale:
      minReplicas: 0 # scale to zero when idle (the first request after a while takes a few seconds)
      # One replica: each has its own Redis, so more replicas would split the rate-limit counts.
      # To scale out, move Redis to a shared service.
      maxReplicas: 1
