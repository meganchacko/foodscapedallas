name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    # Service containers: real PostGIS and Redis running next to the job, reachable on localhost
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: foodscape
          POSTGRES_PASSWORD: ci-only-password # throwaway database that only exists during this job
          POSTGRES_DB: foodscape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodscape -d foodscape"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: foodscape
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: foodscape
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            pipeline/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r pipeline/requirements.txt
      # backend and pipeline tests; they never download real data, so CI doesn't depend on
      # government websites being up
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # also type-checks (tsc -b)

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f backend/Dockerfile -t foodscape-backend .
      - run: docker build -f pipeline/Dockerfile -t foodscape-pipeline .
      - run: docker build -t foodscape-frontend ./frontend

  deploy:
    # Pushes to main only, after every check above passes, and only once Azure is set up
    # (repository variable AZURE_DEPLOY_ENABLED = true; see deploy/README.md)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [lint, tests, frontend, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GitHub's container registry (ghcr.io)
      id-token: write # sign in to Azure with a short-lived OIDC token, no stored password
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/foodscape-backend
      PIPELINE_IMAGE: ghcr.io/${{ github.repository_owner }}/foodscape-pipeline
    steps:
      - uses: actions/checkout@v5

      - name: Build and push images, tagged with the commit
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f backend/Dockerfile -t "$BACKEND_IMAGE:${{ github.sha }}" .
          docker build -f pipeline/Dockerfile -t "$PIPELINE_IMAGE:${{ github.sha }}" .
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$PIPELINE_IMAGE:${{ github.sha }}"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (migrations, API, weekly pipeline job)
        id: deploy
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          deploy/azure/deploy.sh "${{ github.sha }}"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend for production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.deploy.outputs.api_url }}
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Publish the frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
