name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    # Service containers: real PostGIS and Redis running next to the job, reachable on localhost
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: foodscape
          POSTGRES_PASSWORD: ci-only-password # throwaway database that only exists during this job
          POSTGRES_DB: foodscape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodscape -d foodscape"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: foodscape
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: foodscape
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            pipeline/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r pipeline/requirements.txt
      # backend and pipeline tests; they never download real data, so CI doesn't depend on
      # government websites being up
      - run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # also type-checks (tsc -b)

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t foodscape-backend ./backend
      - run: docker build -t foodscape-frontend ./frontend
