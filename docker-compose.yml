# Local development stack. Start everything with: docker compose up
name: foodscape
services:
  db:
    image: postgis/postgis:16-3.5
    # the official PostGIS image is only built for Intel (amd64); Apple Silicon runs it emulated
    platform: linux/amd64
    env_file: .env # the image reads POSTGRES_USER/PASSWORD/DB to create the user and database
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data # named volume, so data survives container restarts
    healthcheck:
      # $$ escapes $ so the variable is expanded inside the container, not by compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Built from the repo root so the image can include the trained model (ml/model/)
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Apply any pending migrations, then start the server.
    # --reload restarts the server when a file in the mounted app/ folder changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      # inside the compose network, services reach each other by service name
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Trust X-Forwarded-For (the real client IP, used for rate limiting) only from the Docker
      # network, where the Vite proxy runs. Production sets its load balancer's addresses.
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
      # Off only for load tests: RATE_LIMIT_ENABLED=false docker compose up -d backend
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./ml/model:/app/model # a retrained model is picked up without rebuilding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      # ${CARTO_API_KEY:-} reads CARTO_API_KEY from .env (empty if unset)
      VITE_CARTO_API_KEY: ${CARTO_API_KEY:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src # edits show up instantly via Vite's hot reload
    depends_on:
      - backend

volumes:
  db-data:
